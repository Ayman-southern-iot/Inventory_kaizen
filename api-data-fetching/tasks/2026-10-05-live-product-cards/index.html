<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live inventory</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #5b6270; --line: #e2e5ea;
    --accent: #1f5eff; --ok: #14804a; --warn: #a15c00; --bad: #b42318; --track: #e8ebf0; --flash: #fff4c2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216; --panel: #181b21; --text: #eceef2; --muted: #9aa3b2; --line: #2a2f38;
      --accent: #7aa2ff; --ok: #4cc38a; --warn: #f0b24b; --bad: #ff8a80; --track: #262b34; --flash: #4a4217;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .pill.live .dot { background: var(--ok); animation: pulse 2s infinite; }
  .pill.bad .dot { background: var(--bad); }
  .banner { display: none; margin: 0 0 14px; padding: 10px 14px; border: 1px solid var(--bad); border-radius: 10px; color: var(--bad); background: var(--panel); }
  .banner.show { display: block; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  input[type=search], select { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); font: inherit; min-width: 0; }
  input[type=search] { flex: 1 1 240px; }
  label.check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .card.changed { animation: flash 2.2s ease-out; }
  .crumbs { color: var(--muted); font-size: 12px; }
  .card h2 { font-size: 16px; line-height: 1.3; margin: 0; overflow-wrap: anywhere; }
  .code { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .desc { margin: 0; color: var(--muted); font-size: 13px; }
  .stock { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; }
  .avail { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .avail.none { color: var(--bad); }
  .of { color: var(--muted); font-size: 13px; }
  .inuse { margin-left: auto; font-size: 12px; color: var(--warn); }
  .bar { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .4s ease; }
  .shelves { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .shelves li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 8px; border-radius: 8px; background: var(--bg); }
  .shelves b { font-variant-numeric: tabular-nums; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 48px 0; }
  @keyframes flash { 0% { background: var(--flash); border-color: var(--accent); } 100% { background: var(--panel); } }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .card.changed, .pill.live .dot { animation: none; } .bar span { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Live inventory</h1>
      <div class="sub" id="summary">Waiting for data...</div>
    </div>
    <div class="pill" id="pill" role="status" aria-live="polite"><span class="dot"></span><span id="pillText">Connecting...</span></div>
  </header>

  <div class="banner" id="banner" role="alert"></div>

  <div class="tools">
    <input type="search" id="q" placeholder="Search name, code, category or shelf" aria-label="Search products">
    <select id="cat" aria-label="Filter by category"><option value="">All categories</option></select>
    <label class="check"><input type="checkbox" id="onlyStock"> In stock only</label>
  </div>

  <main class="grid" id="grid" aria-live="off"></main>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const grid = $('grid'), pill = $('pill'), pillText = $('pillText'), banner = $('banner'), summary = $('summary');
  let products = [];
  let previous = new Map();   // product id -> JSON string, to highlight cards that changed
  let lastOkAt = null;

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;   // textContent only: product data is never parsed as HTML
    return n;
  };
  const time = (iso) => (iso ? new Date(iso).toLocaleTimeString() : 'never');

  function card(p, changed) {
    const stock = p.stock || { total: 0, available: 0, inUse: 0 };
    const a = el('article', 'card' + (changed ? ' changed' : ''));
    a.append(el('div', 'crumbs', (p.category?.path || []).join(' › ') || 'Uncategorised'));
    a.append(el('h2', '', p.name || '(no name)'));
    a.append(el('div', 'code', [p.code, p.unit].filter(Boolean).join(' · ')));
    if (p.description) a.append(el('p', 'desc', p.description));
    const row = el('div', 'stock');
    row.append(el('span', 'avail' + (stock.available > 0 ? '' : ' none'), String(stock.available)));
    row.append(el('span', 'of', `available of ${stock.total}`));
    if (stock.inUse > 0) row.append(el('span', 'inuse', `${stock.inUse} in use`));
    a.append(row);
    const bar = el('div', 'bar'), fill = el('span');
    fill.style.width = (stock.total > 0 ? Math.max(0, Math.min(100, (stock.available / stock.total) * 100)) : 0) + '%';
    bar.append(fill);
    a.append(bar);
    const shelves = el('ul', 'shelves');
    for (const s of p.locations || []) {
      const li = el('li');
      li.append(el('span', '', s.label || s.storageId || 'Unknown shelf'), el('b', '', String(s.quantity)));
      shelves.append(li);
    }
    if (shelves.children.length) a.append(shelves);
    return a;
  }

  function render() {
    const q = $('q').value.trim().toLowerCase(), cat = $('cat').value, only = $('onlyStock').checked;
    const shown = products.filter((p) => {
      if (only && !(p.stock && p.stock.available > 0)) return false;
      if (cat && !(p.category?.path || []).includes(cat)) return false;
      if (!q) return true;
      const hay = [p.name, p.code, p.description, (p.category?.path || []).join(' '), (p.locations || []).map((l) => l.label).join(' ')].join(' ').toLowerCase();
      return hay.includes(q);
    });
    const next = new Map(products.map((p) => [p.id, JSON.stringify(p)]));
    const cards = shown.map((p) => card(p, previous.size > 0 && previous.get(p.id) !== next.get(p.id)));
    previous = next;
    if (!cards.length) cards.push(el('div', 'empty', products.length ? 'No products match.' : 'No products yet.'));
    grid.replaceChildren(...cards);
    summary.textContent = `${shown.length} of ${products.length} products` + (lastOkAt ? ` · updated ${time(lastOkAt)}` : '');
  }

  function fillCategories() {
    const sel = $('cat'), current = sel.value;
    const names = [...new Set(products.flatMap((p) => p.category?.path || []))].sort((x, y) => x.localeCompare(y));
    sel.replaceChildren(el('option', '', 'All categories'), ...names.map((n) => el('option', '', n)));
    sel.firstChild.value = '';
    sel.value = names.includes(current) ? current : '';
  }

  function setPill(kind, text) {
    pill.className = 'pill ' + kind;
    pillText.textContent = text;
  }

  const es = new EventSource('/events');
  es.addEventListener('snapshot', (e) => {
    const s = JSON.parse(e.data);
    products = s.products;
    lastOkAt = s.fetchedAt;
    fillCategories();
    render();
  });
  es.addEventListener('status', (e) => {
    const st = JSON.parse(e.data);
    if (st.lastOkAt) lastOkAt = st.lastOkAt;
    if (st.ok) {
      banner.classList.remove('show');
      setPill('live', `Live · checked every ${st.pollSeconds}s`);
    } else {
      setPill('bad', 'Not connected to IMS');
      banner.textContent = `${st.error}. Showing the last data received at ${time(lastOkAt)}.`;
      banner.classList.add('show');
    }
  });
  es.onerror = () => {
    setPill('bad', 'Reconnecting to local server...');
  };
  es.onopen = () => setPill('', 'Connected, waiting for IMS...');

  $('q').addEventListener('input', render);
  $('cat').addEventListener('change', render);
  $('onlyStock').addEventListener('change', render);
})();
</script>
</body>
</html>
